[package]
name = "rust_lake"
version = "0.1.0"
edition = "2021"
authors = ["Etudiant MBA Big Data & IA"]
description = "Moteur ETL pedagogique en Rust pour consolider les fondamentaux du langage"
license = "MIT"

[dependencies]
thiserror = "1.0"
anyhow = "1.0"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
sha2 = "0.10"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
